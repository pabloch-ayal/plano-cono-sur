name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Configurar Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Preparar carpeta web (www)
        run: |
          mkdir -p www
          cp index.html www/
          cp lotes_tacna.geojson www/
          if [ -f "icon.png" ]; then
            cp icon.png www/
          fi

      - name: Instalar dependencias Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Inicializar proyecto Capacitor
        run: |
          npx cap init "Plano Cono Sur" "com.conosur.app" --web-dir "www"

      - name: Agregar plataforma Android
        run: |
          npx cap add android

      - name: Actualizar icono oficial de la App
        run: |
          if [ -f "icon.png" ]; then
            find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp icon.png {} \; || true
          fi

      - name: Sincronizar archivos web con Android
        run: |
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Plano-Cono-Sur-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
