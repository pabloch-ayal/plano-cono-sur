name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Configurar Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Inicializar proyecto Capacitor (si no existe)
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Plano Cono Sur" "com.conosur.app" --web-dir "."
          fi

      - name: Agregar plataforma Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Actualizar icono oficial de la App
        run: |
          if [ -f "icon.png" ]; then
            find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp icon.png {} \; || true
          fi

      - name: Sincronizar archivos web con Android
        run: |
          npx cap sync android

      - name: Compilar APK en modo Release / Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Plano-Cono-Sur-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
