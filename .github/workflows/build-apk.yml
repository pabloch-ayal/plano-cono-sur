name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Preparar carpeta web (www)
        run: |
          mkdir -p www
          cp index.html www/
          cp lotes_tacna.geojson www/
          if [ -f "icon.png" ]; then
            cp icon.png www/
          fi

      - name: Instalar Capacitor v6 estable
        run: |
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0

      - name: Generar configuración Capacitor forzando www
        run: |
          rm -f capacitor.config.json capacitor.config.ts
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.conosur.app",
            "appName": "Plano Cono Sur",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Agregar plataforma Android
        run: |
          rm -rf android
          npx cap add android

      - name: Actualizar icono oficial de la App
        run: |
          if [ -f "icon.png" ]; then
            find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp icon.png {} \; || true
          fi

      - name: Sincronizar archivos web con Android
        run: |
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Plano-Cono-Sur-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
