<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Plano Cono Sur</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      position: fixed;
    }

    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Panel de búsqueda adaptado para móviles */
    .search-panel {
      position: absolute;
      top: 12px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      padding: 10px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .inputs-row {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .inputs-row input {
      border: 1px solid #c2c2c2;
      border-radius: 8px;
      padding: 8px 6px;
      font-size: 13px;
      outline: none;
      min-width: 0;
    }

    #inputAsoc { flex: 2; }
    #inputMz { flex: 1; }
    #inputLote { flex: 1; }

    .inputs-row input:focus {
      border-color: #1a73e8;
    }

    .actions-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn-search {
      flex: 1;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-mic {
      background: #f1f3f4;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 44px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-mic.listening {
      background: #ea4335;
      color: white;
    }

    /* Botón GPS flotante */
    .gps-btn {
      position: absolute;
      bottom: 30px;
      right: 16px;
      z-index: 1000;
      background: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      box-shadow: 0 3px 12px rgba(0,0,0,0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      border: none;
      cursor: pointer;
      font-size: 22px;
    }

    /* Estilo del botón de Google Maps dentro del globo */
    .btn-gmaps {
      display: block;
      margin-top: 8px;
      background: #34a853;
      color: white !important;
      text-align: center;
      text-decoration: none;
      padding: 8px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- Panel superior fijo -->
  <div class="search-panel">
    <div class="inputs-row">
      <input type="text" id="inputAsoc" placeholder="Asociación" autocomplete="off">
      <input type="text" id="inputMz" placeholder="Mz" autocomplete="off">
      <input type="text" id="inputLote" placeholder="Lote" autocomplete="off">
    </div>
    <div class="actions-row">
      <button class="btn-mic" id="btnMic" onclick="activarVoz()" title="Dictar dirección">🎤</button>
      <button class="btn-search" onclick="ejecutarBusqueda()">Buscar Predio</button>
    </div>
  </div>

  <button class="gps-btn" onclick="obtenerUbicacion()" title="Mi Ubicación">🎯</button>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { 
      zoomControl: false,
      attributionControl: false 
    }).setView([-18.055, -70.265], 14);

    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 21
    }).addTo(map);

    setTimeout(() => {
      map.invalidateSize();
    }, 400);

    window.addEventListener('resize', () => {
      map.invalidateSize();
    });

    let datosGeoJSON = null;
    let marcador = null;

    fetch('lotes_tacna.geojson')
      .then(r => r.json())
      .then(d => {
        datosGeoJSON = d;
      })
      .catch(e => console.error(e));

    function ejecutarBusqueda() {
      const asoc = document.getElementById('inputAsoc').value.trim().toLowerCase();
      const mz = document.getElementById('inputMz').value.trim().toLowerCase();
      const lote = document.getElementById('inputLote').value.trim().toLowerCase();

      if (!asoc && !mz && !lote) {
        alert("Ingresa al menos un dato (Asociación, Mz o Lote)");
        return;
      }

      if (!datosGeoJSON) {
        alert("Cargando datos del plano...");
        return;
      }

      if (asoc) {
        const zona = datosGeoJSON.features.find(f => {
          const txt = (f.properties?.Text || '').toLowerCase();
          return txt.includes(asoc);
        });

        if (zona) {
          const cZona = zona.geometry.coordinates;

          if (lote) {
            const lotes = datosGeoJSON.features.filter(f => {
              const txt = (f.properties?.Text || '').trim().toLowerCase();
              return txt === lote;
            });

            if (lotes.length > 0) {
              let mejorLote = lotes[0];
              let menorDist = Infinity;

              lotes.forEach(l => {
                const cL = l.geometry.coordinates;
                const d = Math.hypot(cL[0] - cZona[0], cL[1] - cZona[1]);
                if (d < menorDist) {
                  menorDist = d;
                  mejorLote = l;
                }
              });

              const cMejor = mejorLote.geometry.coordinates;
              const lat = cMejor[1];
              const lng = cMejor[0];
              const texto = `<b>${zona.properties.Text}</b><br>Lote: ${lote}<br><a class="btn-gmaps" href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank">🗺️ ¿Cómo llegar? (Google Maps)</a>`;
              ubicar([lat, lng], texto);
              return;
            }
          }

          const latZ = cZona[1];
          const lngZ = cZona[0];
          const textoZona = `<b>Zona:</b> ${zona.properties.Text}<br><a class="btn-gmaps" href="https://www.google.com/maps/dir/?api=1&destination=${latZ},${lngZ}" target="_blank">🗺️ Ir a esta zona</a>`;
          ubicar([latZ, lngZ], textoZona);
          return;
        }
      }

      if (lote) {
        const res = datosGeoJSON.features.find(f => {
          const txt = (f.properties?.Text || '').trim().toLowerCase();
          return txt === lote;
        });

        if (res) {
          const c = res.geometry.coordinates;
          const lat = c[1];
          const lng = c[0];
          const textoLote = `<b>Lote:</b> ${lote}<br><a class="btn-gmaps" href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank">🗺️ ¿Cómo llegar? (Google Maps)</a>`;
          ubicar([lat, lng], textoLote);
          return;
        }
      }

      alert("No se encontró coincidencia.");
    }

    function ubicar(latLng, textoHtml) {
      if (marcador) map.removeLayer(marcador);
      marcador = L.circleMarker(latLng, {
        radius: 12,
        fillColor: "#00e5ff",
        color: "#ffffff",
        weight: 3,
        fillOpacity: 0.95
      }).addTo(map);

      marcador.bindPopup(textoHtml).openPopup();
      map.setView(latLng, 19);
    }

    function activarVoz() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Voz no compatible con este celular");
        return;
      }

      const rec = new SpeechRecognition();
      rec.lang = 'es-PE';
      rec.start();

      const btn = document.getElementById('btnMic');
      btn.classList.add('listening');

      rec.onresult = (e) => {
        const texto = e.results[0][0].transcript.toLowerCase();

        const matchLote = texto.match(/lote\s*(\d+)/i) || texto.match(/\d+/);
        if (matchLote) document.getElementById('inputLote').value = matchLote[1] || matchLote[0];

        const matchMz = texto.match(/(?:manzana|mz)\s*([a-z0-9]+)/i);
        if (matchMz) document.getElementById('inputMz').value = matchMz[1].toUpperCase();

        ejecutarBusqueda();
      };

      rec.onspeechend = () => {
        btn.classList.remove('listening');
        rec.stop();
      };

      rec.onerror = () => {
        btn.classList.remove('listening');
      };
    }

    function obtenerUbicacion() {
      if (!navigator.geolocation) {
        alert("GPS no soportado");
        return;
      }
      navigator.geolocation.getCurrentPosition(pos => {
        const latLng = [pos.coords.latitude, pos.coords.longitude];
        L.circleMarker(latLng, { radius: 8, fillColor: "#1a73e8", color: "#fff", weight: 2, fillOpacity: 1 }).addTo(map);
        map.setView(latLng, 18);
      }, () => alert("Permiso de GPS no concedido"));
    }
  </script>
</body>
</html>
