<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Catastro Gregorio Albarracin</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html, #map { height: 100%; width: 100%; overflow: hidden; font-family: sans-serif; }

    /* Contenedor flotante superior con 3 casillas */
    .search-panel {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 95%;
      max-width: 550px;
      background: white;
      padding: 10px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .inputs-row {
      display: flex;
      gap: 6px;
    }

    .inputs-row input {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 8px;
      font-size: 14px;
      outline: none;
    }

    #inputAsoc { flex: 2; }
    #inputMz { flex: 1; }
    #inputLote { flex: 1; }

    .inputs-row input:focus { border-color: #1a73e8; }

    .actions-row {
      display: flex;
      gap: 8px;
    }

    .btn-search {
      flex: 1;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 9px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-mic {
      background: #f1f3f4;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 18px;
      cursor: pointer;
    }

    .btn-mic.listening {
      background: #ea4335;
      color: white;
    }

    /* Botón GPS flotante abajo */
    .gps-btn {
      position: absolute;
      bottom: 25px;
      right: 20px;
      z-index: 1000;
      background: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      border: none;
      cursor: pointer;
      font-size: 22px;
    }
  </style>
</head>
<body>

  <!-- Panel de búsqueda con 3 casillas -->
  <div class="search-panel">
    <div class="inputs-row">
      <input type="text" id="inputAsoc" placeholder="Asoc. / Sector (Ej. Jaime Yoshiyama)" autocomplete="off">
      <input type="text" id="inputMz" placeholder="Mz (Ej. A2)" autocomplete="off">
      <input type="text" id="inputLote" placeholder="Lote (Ej. 32)" autocomplete="off">
    </div>
    <div class="actions-row">
      <button class="btn-mic" id="btnMic" onclick="activarVoz()" title="Dictar dirección">🎤</button>
      <button class="btn-search" onclick="ejecutarBusqueda()">Buscar Predio</button>
    </div>
  </div>

  <!-- Botón GPS -->
  <button class="gps-btn" onclick="obtenerUbicacion()" title="Mi Ubicación">🎯</button>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inicializar mapa en Gregorio Albarracín
    const map = L.map('map', { zoomControl: false }).setView([-18.055, -70.265], 14);

    // Mapa satelital Google
    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 21 }).addTo(map);

    let datosGeoJSON = null;
    let marcador = null;

    // Cargar archivo
    fetch('lotes_tacna.geojson')
      .then(r => r.json())
      .then(d => {
        datosGeoJSON = d;
        console.log("Catastro cargado con éxito");
      })
      .catch(e => console.error(e));

    // Función de búsqueda combinada
    function ejecutarBusqueda() {
      const asoc = document.getElementById('inputAsoc').value.trim().toLowerCase();
      const mz = document.getElementById('inputMz').value.trim().toLowerCase();
      const lote = document.getElementById('inputLote').value.trim().toLowerCase();

      if (!asoc && !mz && !lote) {
        alert("Ingresa al menos un dato para buscar (Asociación, Manzana o Lote)");
        return;
      }

      if (!datosGeoJSON) {
        alert("Cargando datos catastrales...");
        return;
      }

      // Si busca por Asociación primero
      if (asoc) {
        const zona = datosGeoJSON.features.find(f => {
          const txt = (f.properties?.Text || '').toLowerCase();
          return txt.includes(asoc);
        });

        if (zona) {
          const cZona = zona.geometry.coordinates;
          
          // Si además puso Lote, buscamos el lote más cercano a esa Asociación
          if (lote) {
            const lotesCoincidentes = datosGeoJSON.features.filter(f => {
              const txt = (f.properties?.Text || '').trim().toLowerCase();
              return txt === lote;
            });

            if (lotesCoincidentes.length > 0) {
              // Calcular el lote más cercano a la etiqueta de la Asociación
              let mejorLote = lotesCoincidentes[0];
              let menorDistancia = Infinity;

              lotesCoincidentes.forEach(l => {
                const cL = l.geometry.coordinates;
                const dist = Math.hypot(cL[0] - cZona[0], cL[1] - cZona[1]);
                if (dist < menorDistancia) {
                  menorDistancia = dist;
                  mejorLote = l;
                }
              });

              ubicarEnMapa(mejorLote.geometry.coordinates, `<b>${zona.properties.Text}</b><br>Lote: ${lote}`);
              return;
            }
          }

          // Si solo puso Asociación, va a la zona
          ubicarEnMapa(cZona, `<b>Zona:</b> ${zona.properties.Text}`);
          return;
        }
      }

      // Búsqueda directa por Lote si no especificó Asociación
      if (lote) {
        const res = datosGeoJSON.features.find(f => {
          const txt = (f.properties?.Text || '').trim().toLowerCase();
          return txt === lote;
        });

        if (res) {
          ubicarEnMapa(res.geometry.coordinates, `Lote: ${lote}`);
          return;
        }
      }

      alert("No se encontró coincidencia con los datos ingresados.");
    }

    function ubicarEnMapa(coords, textoPopup) {
      if (marcador) map.removeLayer(marcador);
      marcador = L.circleMarker([coords[1], coords[0]], {
        radius: 12,
        fillColor: "#00e5ff",
        color: "#ffffff",
        weight: 3,
        fillOpacity: 0.95
      }).addTo(map);

      marcador.bindPopup(textoPopup).openPopup();
      map.setView([coords[1], coords[0]], 19);
    }

    // Buscador por voz
    function activarVoz() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("El reconocimiento por voz no está disponible en este dispositivo.");
        return;
      }

      const rec = new SpeechRecognition();
      rec.lang = 'es-PE';
      rec.start();

      const btn = document.getElementById('btnMic');
      btn.classList.add('listening');

      rec.onresult = (e) => {
        const texto = e.results[0][0].transcript.toLowerCase();
        console.log("Dictado:", texto);

        // Detectar Lote (ejemplo: "lote 14")
        const matchLote = texto.match(/lote\s*(\d+)/i) || texto.match(/\d+/);
        if (matchLote) document.getElementById('inputLote').value = matchLote[1] || matchLote[0];

        // Detectar Manzana (ejemplo: "manzana b" o "mz a2")
        const matchMz = texto.match(/(?:manzana|mz)\s*([a-z0-9]+)/i);
        if (matchMz) document.getElementById('inputMz').value = matchMz[1].toUpperCase();

        ejecutarBusqueda();
      };

      rec.onspeechend = () => {
        btn.classList.remove('listening');
        rec.stop();
      };

      rec.onerror = () => {
        btn.classList.remove('listening');
      };
    }

    // GPS en tiempo real
    function obtenerUbicacion() {
      if (!navigator.geolocation) {
        alert("GPS no soportado");
        return;
      }
      navigator.geolocation.getCurrentPosition(pos => {
        const latLng = [pos.coords.latitude, pos.coords.longitude];
        L.circleMarker(latLng, { radius: 8, fillColor: "#1a73e8", color: "#fff", weight: 2, fillOpacity: 1 }).addTo(map);
        map.setView(latLng, 18);
      }, () => alert("No se pudo obtener la señal GPS"));
    }
  </script>
</body>
</html>
