<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de Licencias - Plano Cono Sur</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #1e293b; padding: 25px; border-radius: 12px; width: 320px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; text-align: center; font-size: 16px; box-sizing: border-box; text-transform: uppercase; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .res { margin-top: 15px; font-size: 20px; font-weight: bold; color: #38bdf8; background: #0f172a; padding: 10px; border-radius: 6px; user-select: all; }
  </style>
</head>
<body>
  <div class="box">
    <h3>Generador de Claves</h3>
    <input type="text" id="idInput" placeholder="Ej: TAC-8492">
    <button onclick="generar()">Crear Clave de Activación</button>
    <div id="resultado" class="res">---</div>
  </div>

  <script>
    function generar() {
      const id = document.getElementById('idInput').value.trim().toUpperCase();
      if (!id) return;
      let hash = 5381;
      const str = "CONOSUR_SALT_2026_" + id;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) + hash) + str.charCodeAt(i);
        hash = hash & 0xFFFFFFF;
      }
      const clave = "ACT-" + Math.abs(hash).toString(36).toUpperCase().padStart(6, '0');
      document.getElementById('resultado').innerText = clave;
    }
  </script>
</body>
</html>
